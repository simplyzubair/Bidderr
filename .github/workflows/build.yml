name: Build and Release Bidderr

# Every push to main that changes the app becomes a release v2.0.<run number>.
# Installed apps (Windows and Android) see the new release and update themselves.
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'website/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      build: ${{ steps.v.outputs.build }}
    steps:
      - id: v
        run: |
          echo "version=2.0.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "build=$(( ${{ github.run_number }} + 100 ))" >> "$GITHUB_OUTPUT"

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test

  android:
    needs: [version, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build signed APK
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/bidderr-release.p12"
          echo "$ANDROID_KEYSTORE_B64" | base64 -d > "$ANDROID_KEYSTORE_FILE"
          gradle -p android assembleRelease --no-daemon \
            -PappVersion=${{ needs.version.outputs.version }} -PappBuild=${{ needs.version.outputs.build }}
          rm -f "$ANDROID_KEYSTORE_FILE"
          cp android/app/build/outputs/apk/release/app-release.apk Bidderr.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: Bidderr.apk

  windows:
    needs: [version, test]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - shell: bash
        run: npx electron-builder --win --publish never "-c.extraMetadata.version=${{ needs.version.outputs.version }}"
      - name: Smoke test the packaged app
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'smoke.json'
          $p = Start-Process release\win-unpacked\Bidderr.exe -ArgumentList "--smoke-test=$out" -PassThru
          if (-not $p.WaitForExit(60000)) { $p.Kill(); throw 'Packaged app did not finish its smoke test' }
          $r = Get-Content $out | ConvertFrom-Json
          Write-Host "packaged app: version $($r.version), hotkey registered $($r.hotkeyOk)"
          if (-not $r.hotkeyOk) { throw 'Packaged app could not register Ctrl+Shift+1' }
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            release/Bidderr-Setup.exe
            release/Bidderr-Setup.exe.blockmap
            release/latest.yml

  # Real desktop test: select a job in Notepad and Chrome, press Ctrl+Shift+1, check the clipboard.
  e2e-windows:
    needs: test
    runs-on: windows-latest
    # On test branches a failure here must not email the user: the agent reads the result itself.
    # On main it stays strict and blocks the release.
    continue-on-error: ${{ github.ref != 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - shell: pwsh
        run: ./test/e2e-windows.ps1
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-windows
          path: ${{ runner.temp }}/bidderr-e2e/*

  # Real emulator test: share a job, tap the bubble over Chrome.
  e2e-android:
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: ${{ github.ref != 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: android
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        timeout-minutes: 7
        continue-on-error: true
        env:
          ANDROID_EMULATOR_WAIT_TIME_BEFORE_KILL: 5
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-boot-timeout: 300000
          script: timeout 10m env OUT=e2e-android bash test/e2e-android.sh Bidderr.apk
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-android
          path: e2e-android/
      - name: Verify Android E2E passed
        if: always()
        run: test -f e2e-android/PASS

  release:
    needs: [version, android, windows, e2e-windows, e2e-android]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: v${{ needs.version.outputs.version }}
        run: |
          gh release create "$VERSION" --target "${{ github.sha }}" --title "Bidderr $VERSION" --generate-notes \
            Bidderr.apk Bidderr-Setup.exe Bidderr-Setup.exe.blockmap latest.yml

# Host nginx on Contabo: static download page for bidderr.skillsgeek.com.
# Files live in /var/www/bidderr (copied by scripts/deploy-website.sh).
# HTTPS is added by `certbot --nginx -d bidderr.skillsgeek.com` (it edits this file).
# The Cloudflare DNS record must stay "DNS only" (grey cloud).

server {
    listen 80;
    listen [::]:80;
    server_name bidderr.skillsgeek.com;

    root /var/www/bidderr;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_types text/css application/javascript;

    location / {
        try_files $uri $uri/ =404;
    }
}

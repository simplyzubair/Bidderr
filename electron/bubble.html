<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; media-src 'self'">
  <link rel="stylesheet" href="../shared/bubble.css">
  <link rel="stylesheet" href="ring.css">
</head>
<body>
  <!-- Icon-only bubble next to the mouse. The state shows on the logo: glow (write),
       spinning ring (writing), paste badge, check badge, red badge (error). -->
  <div id="bubble" class="mini offer" role="button" title="Write proposal">
    <img class="mark" src="../branding/mark.svg" alt="">
    <span class="badge"></span>
  </div>

  <!-- Right-click on the bubble: a ring of actions around it. Buttons go clockwise from the top. -->
  <div id="ring" class="ring" hidden>
    <button data-action="stop" aria-label="Stop writing"><i class="ico ico-stop"></i></button>
    <button data-action="copy" aria-label="Copy last proposal"><i class="ico ico-copy"></i></button>
    <button data-action="settings" aria-label="Open Bidderr"><i class="ico ico-settings"></i></button>
    <button data-action="pin" aria-label="Pin bubble here"><i class="ico ico-pin"></i></button>
    <button data-action="restart" aria-label="Restart Bidderr"><i class="ico ico-restart"></i></button>
    <button data-action="quit" aria-label="Quit Bidderr"><i class="ico ico-quit"></i></button>
    <button data-action="hide" aria-label="Hide bubble"><i class="ico ico-hide"></i></button>
    <button data-action="snooze" aria-label="Pause 30 min"><i class="ico ico-snooze"></i></button>
    <button id="ring-close" class="center" aria-label="Close"><i class="ico ico-close"></i></button>
    <div id="ring-label" class="ring-label"></div>
  </div>
  <script src="../shared/ui.js"></script>
  <script src="bubble.js"></script>
</body>
</html>

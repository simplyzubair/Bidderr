plugins {
    id 'com.android.application'
}

android {
    namespace 'com.bidderr.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.bidderr.app'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '2.0.0'
    }

    sourceSets {
        // The proposal engine and styles are shared with the Windows app.
        main.assets.srcDirs += ['../../shared']
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}

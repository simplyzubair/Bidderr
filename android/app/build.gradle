plugins {
    id 'com.android.application'
}

// CI passes the version (2.0.<run number>) and the signing key. Local builds use defaults.
def appVersion = project.findProperty('appVersion') ?: '2.0.0'
def appBuild = (project.findProperty('appBuild') ?: '1').toInteger()
def keystoreFile = System.getenv('ANDROID_KEYSTORE_FILE')

android {
    namespace 'com.bidderr.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.bidderr.app'
        minSdk 24
        targetSdk 34
        versionCode appBuild
        versionName appVersion
    }

    signingConfigs {
        release {
            if (keystoreFile) {
                storeFile file(keystoreFile)
                storeType 'pkcs12'
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias 'bidderr'
                keyPassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig keystoreFile ? signingConfigs.release : signingConfigs.debug
        }
    }

    sourceSets {
        // The proposal engine and styles are shared with the Windows app.
        main.assets.srcDirs += ['../../shared']
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'androidx.core:core:1.13.1'
}

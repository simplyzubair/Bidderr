<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; media-src 'self'; connect-src https://generativelanguage.googleapis.com">
  <title>Bidderr writer</title>
  <link rel="stylesheet" href="bubble.css">
  <link rel="stylesheet" href="writer.css">
</head>
<body>
  <!-- Floating bubble at the bottom of the screen, over the job page. -->
  <div class="dock">
    <div id="read" class="read"></div>
    <div id="bubble" class="bubble writing" role="button">
      <img class="logo" src="img/mark.png" alt="">
      <div class="text">
        <div class="label">Writing proposal...</div>
        <div class="sub"></div>
      </div>
      <div class="state"></div>
    </div>
  </div>
  <script src="proposal.js"></script>
  <script src="ui.js"></script>
  <script src="writer.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; media-src 'self'; connect-src https://generativelanguage.googleapis.com">
  <title>Bidderr writer</title>
  <link rel="stylesheet" href="bubble.css">
  <link rel="stylesheet" href="writer.css">
</head>
<body>
  <!-- Floating bubble at the bottom of the screen, over the job page. -->
  <div class="dock">
    <div id="read" class="read"></div>
    <div id="bubble" class="bubble writing" role="button">
      <svg class="logo" viewBox="0 0 512 512" aria-hidden="true">
        <defs><linearGradient id="tile" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#34d399"/><stop offset="0.55" stop-color="#10b981"/><stop offset="1" stop-color="#0f766e"/></linearGradient></defs>
        <rect width="512" height="512" rx="256" fill="url(#tile)"/>
        <path fill="#fff" fill-rule="evenodd" d="M122 96h155c85 0 132 43 132 111 0 45-22 76-61 94 52 16 80 54 80 109 0 75-54 114-143 114H122V96zm79 72v108h76c40 0 60-19 60-55s-20-53-60-53h-76zm0 174v110h83c44 0 66-17 66-54 0-38-23-56-68-56h-81z"/>
      </svg>
      <div class="text">
        <div class="label">Writing proposal...</div>
        <div class="sub"></div>
      </div>
      <div class="state"></div>
    </div>
  </div>
  <script src="proposal.js"></script>
  <script src="ui.js"></script>
  <script src="writer.js"></script>
</body>
</html>
